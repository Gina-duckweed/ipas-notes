<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPAS 中級考古題練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--ink:#1E2530;--sub:#4A4F57;--mute:#6B6558;--bg:#FBF7F0;--card:#FFFDF8;--line:#E5DCCB;--or:#E2622D;--or2:#B8481C;--te:#2A7F92;--te2:#2A6F80;--go:#E8A33D;--ok:#2E8B57;--okbg:#E8F4EE;--ng:#C0392B;--ngbg:#FDECEA}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(160deg,#FFF1DE 0%,#FBF7F0 40%,#E3F1EF 100%);background-attachment:fixed;color:var(--ink);font-family:'Noto Sans TC',Arial,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:var(--te2)}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 80px}
.eb{margin:0;color:var(--or2);font-weight:700;letter-spacing:2px;font-size:14px}
h1{margin:4px 0 6px;font-size:clamp(28px,6vw,44px);font-weight:900;line-height:1.2}
.lead{margin:0 0 6px;color:var(--sub)}
.nav{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin:6px 0 18px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.lbl{font-weight:700;font-size:14px;color:var(--mute);min-width:44px}
.chip{font:inherit;font-size:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}
.chip.on{background:var(--te2);border-color:var(--te2);color:#fff;font-weight:700}
.chip.or.on{background:var(--or);border-color:var(--or)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.stat{flex:1 1 120px;background:var(--bg);border-radius:12px;padding:8px 12px}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:13px;color:var(--mute)}
.bar{height:6px;background:#EFE7DA;border-radius:9px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--or);width:0;transition:width .3s}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.tag{font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;background:#EFF4F3;color:var(--te2)}
.tag.s1{background:#FDECEA;color:var(--or2)}.tag.s2{background:#FBF0DC;color:#8A5A12}.tag.s3{background:#EFF4F3;color:var(--te2)}
.qno{font-weight:900;font-size:15px;color:var(--mute)}
.group{background:#F6F1E8;border-left:5px solid var(--go);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.group summary{cursor:pointer;font-weight:700;color:#8A5A12}
.stem{font-size:17px;font-weight:500;margin:4px 0 14px}
.txt{white-space:pre-wrap;word-break:break-word}
.fig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px;background:#fff}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:16px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--te)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:#EFE7DA;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.opt .ob{flex:1;min-width:0}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}.opt.ng .k{background:var(--ng);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:12px 16px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--okbg);border:1.5px solid #B9DEC8}.fb.ng{background:var(--ngbg);border:1.5px solid #F1C2BB}
.fb h3{margin:0 0 4px;font-size:17px}
.fb p{margin:0}
.ctl{display:flex;gap:8px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:10px;padding:8px 18px;cursor:pointer;border:2px solid var(--te2);background:#fff;color:var(--te2)}
.btn.solid{background:var(--te2);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:8px}
.ghead{grid-column:1/-1;font-weight:900;font-size:14px;color:var(--te2);margin-top:8px}
.cell{font:inherit;font-size:13px;font-weight:700;height:34px;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.cell.ok{background:var(--okbg);border-color:#9CCFB2;color:var(--ok)}.cell.ng{background:var(--ngbg);border-color:#EBA79E;color:var(--ng)}
.cell.cur{outline:3px solid var(--or);outline-offset:1px}
.empty{text-align:center;color:var(--mute);padding:30px 0}
.small{font-size:13px;color:var(--mute)}
.reset{font:inherit;font-size:13px;background:none;border:none;color:var(--mute);text-decoration:underline;cursor:pointer;padding:0}
@media(max-width:560px){.stem{font-size:16px}.opt{font-size:15px;padding:9px 11px}}
</style>
</head>
<body>
<div class="wrap">
<p class="eb">iPAS 中級 AI 應用規劃師</p>
<h1>考古題線上練習</h1>
<p class="lead">收錄 114 年第二次與 115 年第一次公告試題，三科共 300 題。點選答案立即對答，附解析。</p>
<div class="nav"><a href="../ipas-site/">← 回到 iPAS 筆記首頁</a><a href="../slides/ipas-slides/">→ 前往動畫簡報頁</a></div>

<div class="panel">
 <div class="row"><span class="lbl">梯次</span><span id="fe"></span></div>
 <div class="row"><span class="lbl">科目</span><span id="fs"></span></div>
 <div class="row"><span class="lbl">模式</span><span id="fm"></span></div>
 <div class="stats">
  <div class="stat"><b id="st-n">0</b><span>本範圍題數</span></div>
  <div class="stat"><b id="st-d">0</b><span>已作答</span></div>
  <div class="stat"><b id="st-r">–</b><span>答對率</span></div>
  <div class="stat"><b id="st-w">0</b><span>錯題</span></div>
 </div>
 <div class="bar"><i id="pbar"></i></div>
</div>

<div class="panel" id="qpanel"></div>

<div class="panel">
 <div class="row" style="justify-content:space-between"><b>題號總覽</b><button class="reset" id="reset">清除本範圍作答紀錄</button></div>
 <div class="small">綠色＝答對、紅色＝答錯；作答紀錄只存在這台裝置的瀏覽器中。</div>
 <div class="grid" id="grid"></div>
</div>
<p class="small">試題來源：iPAS AI 應用規劃師中級能力鑑定公告試題。解析為學習整理，僅供參考。</p>
</div>
<script>
const SUBJ={1:'科目一 人工智慧技術應用與規劃',2:'科目二 大數據處理分析與應用',3:'科目三 機器學習技術與應用'};
const SUBJS={1:'科目一',2:'科目二',3:'科目三'};
const EXAM={'114':'114 年第二次','115':'115 年第一次'};
let D=null,list=[],idx=0;
const st={e:'all',s:'all',m:'seq'};
let rec={};try{rec=JSON.parse(localStorage.getItem('ipas-quiz-rec')||'{}')}catch(e){rec={}}
function save(){try{localStorage.setItem('ipas-quiz-rec',JSON.stringify(rec))}catch(e){}}
try{Object.assign(st,JSON.parse(localStorage.getItem('ipas-quiz-st')||'{}'))}catch(e){}
function saveSt(){try{localStorage.setItem('ipas-quiz-st',JSON.stringify(st))}catch(e){}}
const $=id=>document.getElementById(id);
function chips(el,items,key,cls){$(el).innerHTML='';items.forEach(([v,l])=>{const b=document.createElement('button');b.className='chip '+(cls||'')+(st[key]===v?' on':'');b.textContent=l;b.onclick=()=>{st[key]=v;saveSt();build(true)};$(el).appendChild(b)})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function scope(){return D.q.filter(q=>(st.e==='all'||q.e===st.e)&&(st.s==='all'||q.s==+st.s))}
function build(reset){
 chips('fe',[['all','全部'],['114','114 年第二次'],['115','115 年第一次']],'e');
 chips('fs',[['all','全部'],['1','科目一'],['2','科目二'],['3','科目三']],'s');
 chips('fm',[['seq','依序'],['rand','隨機'],['undone','未作答'],['wrong','錯題複習']],'m','or');
 let L=scope();
 if(st.m==='undone')L=L.filter(q=>!rec[q.id]);
 if(st.m==='wrong')L=L.filter(q=>rec[q.id]&&rec[q.id]!==q.a);
 if(st.m==='rand')L=shuffle(L.slice());
 list=L;if(reset)idx=0;if(idx>=list.length)idx=Math.max(0,list.length-1);
 stats();grid();show();
}
function stats(){const S=scope();const done=S.filter(q=>rec[q.id]);const ok=done.filter(q=>rec[q.id]===q.a).length;
 $('st-n').textContent=S.length;$('st-d').textContent=done.length;$('st-r').textContent=done.length?Math.round(ok/done.length*100)+'%':'–';$('st-w').textContent=done.length-ok;$('pbar').style.width=(S.length?done.length/S.length*100:0)+'%'}
function grid(){const g=$('grid');g.innerHTML='';let last='';list.forEach((q,i)=>{if(st.m!=='rand'){const key=q.e+'-'+q.s;if(key!==last){last=key;const h=document.createElement('div');h.className='ghead';h.textContent=EXAM[q.e]+'・'+SUBJ[q.s];g.appendChild(h)}}const b=document.createElement('button');b.className='cell'+(rec[q.id]?(rec[q.id]===q.a?' ok':' ng'):'')+(i===idx?' cur':'');b.textContent=q.n;b.title=EXAM[q.e]+' '+SUBJS[q.s]+' 第 '+q.n+' 題';b.onclick=()=>{idx=i;show();grid();window.scrollTo({top:$('qpanel').offsetTop-10,behavior:'smooth'})};g.appendChild(b)})}
function parts(arr){const f=document.createDocumentFragment();arr.forEach(p=>{if(p.i){const im=document.createElement('img');im.className='fig';im.src=p.i.startsWith('data:')?p.i:'img/'+p.i;im.alt='題目附圖';im.loading='lazy';f.appendChild(im)}else{const d=document.createElement('div');d.className='txt';d.textContent=p.t;f.appendChild(d)}});return f}
function show(){const P=$('qpanel');P.innerHTML='';
 if(!list.length){P.innerHTML='<div class="empty">'+(st.m==='wrong'?'目前沒有錯題，太棒了！':st.m==='undone'?'這個範圍已全部作答完畢。':'沒有符合條件的題目。')+'</div>';return}
 const q=list[idx];
 const h=document.createElement('div');h.className='qhead';h.innerHTML='<span><span class="tag s'+q.s+'">'+SUBJS[q.s]+'</span> <span class="tag">'+EXAM[q.e]+'</span> <span class="tag">'+q.tp+'</span></span><span class="qno">第 '+q.n+' 題　'+(idx+1)+' / '+list.length+'</span>';P.appendChild(h);
 if(q.g&&D.g[q.g]){const G=D.g[q.g];const d=document.createElement('details');d.className='group';d.open=true;const s=document.createElement('summary');s.textContent='題組情境（第 '+G.rng[0]+'～'+G.rng[1]+' 題）';d.appendChild(s);d.appendChild(parts(G.body));P.appendChild(d)}
 const stem=document.createElement('div');stem.className='stem';stem.appendChild(parts(q.q));P.appendChild(stem);
 const os=document.createElement('div');os.className='opts';const btns={};
 Object.entries(q.o).forEach(([k,v])=>{const b=document.createElement('button');b.className='opt';const kk=document.createElement('span');kk.className='k';kk.textContent=k;const ob=document.createElement('span');ob.className='ob';ob.appendChild(parts(v));b.appendChild(kk);b.appendChild(ob);b.onclick=()=>answer(q,k,btns,fb);btns[k]=b;os.appendChild(b)});
 P.appendChild(os);
 const fb=document.createElement('div');fb.className='fb';P.appendChild(fb);
 if(rec[q.id])reveal(q,rec[q.id],btns,fb);
 const c=document.createElement('div');c.className='ctl';
 const pv=document.createElement('button');pv.className='btn';pv.textContent='◀ 上一題';pv.disabled=idx===0;pv.onclick=()=>{idx--;show();grid()};
 const nx=document.createElement('button');nx.className='btn solid';nx.textContent=idx===list.length-1?'已是最後一題':'下一題 ▶';nx.disabled=idx===list.length-1;nx.onclick=()=>{idx++;show();grid();window.scrollTo({top:$('qpanel').offsetTop-10,behavior:'smooth'})};
 c.appendChild(pv);
 if(rec[q.id]){const rt=document.createElement('button');rt.className='btn';rt.textContent='重新作答';rt.onclick=()=>{delete rec[q.id];save();stats();grid();show()};c.appendChild(rt)}
 c.appendChild(nx);P.appendChild(c);
}
function answer(q,k,btns,fb){if(rec[q.id])return;rec[q.id]=k;save();reveal(q,k,btns,fb);stats();grid();
 const c=document.querySelector('.ctl');if(c&&!c.querySelector('.rt')){}}
function reveal(q,k,btns,fb){Object.entries(btns).forEach(([kk,b])=>{b.disabled=true;if(kk===q.a)b.classList.add('ok');else if(kk===k)b.classList.add('ng')});
 const ok=k===q.a;fb.className='fb show '+(ok?'ok':'ng');fb.innerHTML='';const h=document.createElement('h3');h.textContent=ok?'✓ 答對了！正確答案 '+q.a:'✗ 答錯了，你選 '+k+'，正確答案是 '+q.a;h.style.color=ok?'var(--ok)':'var(--ng)';const p=document.createElement('p');p.textContent=q.x;fb.appendChild(h);fb.appendChild(p)}
$('reset').onclick=()=>{const S=scope();if(!S.some(q=>rec[q.id]))return;S.forEach(q=>delete rec[q.id]);save();build(true)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const q=list[idx];if(!q)return;const k=e.key.toUpperCase();
 if('ABCD'.includes(k)&&k.length===1){const b=[...document.querySelectorAll('.opt')].find(b=>b.querySelector('.k').textContent===k);if(b&&!b.disabled)b.click()}
 else if(e.key==='ArrowRight'&&idx<list.length-1){idx++;show();grid()}else if(e.key==='ArrowLeft'&&idx>0){idx--;show();grid()}});
fetch('bank.json').then(r=>r.json()).then(d=>{D=d;build(true)}).catch(()=>{$('qpanel').innerHTML='<div class="empty">題庫載入失敗，請重新整理頁面。</div>'});
</script>
</body>
</html>
